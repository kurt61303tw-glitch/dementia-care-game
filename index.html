<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暖心時光屋｜長照失智情境解題互動遊戲室</title>
  <link rel="stylesheet" href="css/style.css?v=2.7" />
</head>
<body>
  <!-- 頂部木質機構招牌導覽列 -->
  <header class="top-signboard">
    <div class="brand-area" id="brand-home-link" role="button" tabindex="0" aria-label="返回陽光長照交誼廳首頁">
      <div class="brand-badge">🏡</div>
      <div>
        <div class="brand-title">暖心時光屋：長照失智情境解題室</div>
        <span class="brand-subtitle">Q版長照機構互動遊戲 · 照護人員與家屬教育訓練工具</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button class="wood-btn" id="btn-toggle-large-text" title="切換大字高對比投影模式">🔍 大字投影</button>
      <button class="wood-btn" id="btn-toggle-motion" title="切換減少動態效果模式">🌿 減少動畫</button>
      <button class="wood-btn" id="btn-toggle-bgm" title="播放輕鬆愉快、振奮人心的背景音樂">🎵 輕鬆背景音樂</button>
      <button class="wood-btn" id="btn-toggle-mute" title="切換溫馨音效開關">🔊 點擊音效</button>
      <button class="wood-btn" id="btn-open-audit" title="檢視96題完整題庫與7A五關卡審核治理">🛡️ 題庫五關卡審核(96題)</button>
      <button class="wood-btn" id="btn-open-cloud" title="設定4B託管雲端跨手機即時同步">☁️ 雲端連線設定</button>
    </div>
  </header>

  <!-- 主舞台區 -->
  <main class="main-stage" id="app-stage"></main>

  <!-- 彈窗容器（五關卡審核與雲端設定） -->
  <div id="modal-container" class="modal-backdrop hidden"></div>

  <!-- 底部機構溫馨提醒列 -->
  <footer style="text-align:center; padding:18px; color:#6D4C41; font-size:0.88rem; border-top:2px dashed #D7CCC8; background:#FFF8E7;">
    🌱 <strong>照護安全底線提醒</strong>：本系統為機構教育訓練與衛教討論工具，所有案例均已 100% 去識別化。現場實際照護請先排除急性生理不適，並依長輩個別照護計畫與機構 SOP 辦理。
  </footer>

  <!-- 載入 MQTT 即時通訊模組、QR Code 生成器與題庫核心模組 -->
  <script src="js/paho-mqtt.min.js"></script>
  <script src="js/qrious.min.js"></script>
  <script src="js/illustrations.js?v=2.7"></script>
  <script src="js/questions-theme1.js?v=2.7"></script>
  <script src="js/questions-theme2.js?v=2.7"></script>
  <script src="js/sync-engine.js?v=2.7"></script>
  <script src="js/app.js?v=2.7"></script>
</body>
</html>
